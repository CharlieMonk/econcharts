[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econcharts"
version = "0.1.1"
description = "Sharp, professional charts for economic data with dark theme"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Economic Charts Team" }
]
keywords = ["economics", "charts", "plotly", "visualization", "data", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "plotly>=5.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-playwright>=0.4.0",
    "playwright>=1.40.0",
    "pandas>=2.0",
    "pandas-datareader>=0.10",
    "fredapi>=0.5",
    "yfinance>=0.2",
    "jupyter>=1.0",
    "nbformat>=5.0",
]

[project.urls]
Homepage = "https://github.com/econcharts/econcharts"
Documentation = "https://github.com/econcharts/econcharts#readme"
Repository = "https://github.com/econcharts/econcharts"
Issues = "https://github.com/econcharts/econcharts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/econcharts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/econcharts",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
